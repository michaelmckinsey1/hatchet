name: unit tests

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop, releases/** ]

jobs:
  determine-versions:
    runs-on: ubuntu-latest
    outputs:
      python-versions: ${{ steps.set-versions.outputs.versions }}
    steps:
      - uses: actions/checkout@v4

      - id: set-versions
        run: |
          # Extract pandas version requirement from requirements.txt
          PANDAS_REQ=$(grep "^pandas" requirements.txt || echo "")

          # Extract the major version number from various formats (>=3, ==3.0.6, >2.9, etc.)
          MAJOR_VER=$(echo "$PANDAS_REQ" | sed -n 's/.*pandas[>=<]*\([0-9]\+\).*/\1/p')

          if [ -n "$MAJOR_VER" ] && [ "$MAJOR_VER" -ge 3 ]; then
            # pandas>=3.x requires Python 3.11+
            echo "versions=[\"3.11\", \"3.12\", \"3.13\"]" >> $GITHUB_OUTPUT
            echo "Testing with Python 3.11+ (pandas version $MAJOR_VER detected)"
          else
            # pandas<3 supports older Python versions
            echo "versions=[\"3.7\", \"3.8\", \"3.9\", \"3.10\", \"3.11\", \"3.12\", \"3.13\"]" >> $GITHUB_OUTPUT
            echo "Testing with Python 3.7+ (pandas version <3 detected)"
          fi

  build:
    needs: determine-versions
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # TODO: add macos-latest
        os: [ubuntu-22.04]
        # TODO: add pypy2, pypy3
        python-version: ${{ fromJson(needs.determine-versions.outputs.python-versions) }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Python Dependencies for 3.12 and later
      if: ${{ matrix.python-version >= '3.12' }}
      run: |
        python -m pip install --upgrade pip pytest setuptools wheel
        pip install -r requirements.txt
        # Optional Dependency for HDF Checkpointing
        pip install tables
        python setup.py install
        python setup.py build_ext --inplace
        python -m pip list

    - name: Standard Install Python3 Dependencies
      run: |
        python -m pip install --upgrade pip pytest
        pip install -r requirements.txt
        # Optional Dependency for HDF Checkpointing
        pip install tables
        python setup.py install
        python setup.py build_ext --inplace
        python -m pip list

    - name: Update Black
      if: ${{ matrix.python-version == 3.9 }}
      run: |
        pip install flake8-pytest-importorskip
        pip install --upgrade click==8.0.4
        pip install black==24.4.2
        pip install flake8==4.0.1

    - name: Lint and Format Check with Flake8 and Black
      if: ${{ matrix.python-version == 3.9 }}
      run: |
        black --diff --check .
        flake8

    - name: Check License Headers
      run: |
        python license.py verify

    - name: Clone Caliper
      uses: actions/checkout@v4
      with:
        repository: LLNL/Caliper
        path: Caliper
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Caliper
      working-directory: Caliper
      run: |
        echo -e "PWD: $(pwd)"
        mkdir build
        cd build
        cmake -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/caliper-install ../
        make VERBOSE=1
        make install
        export PATH=${{ github.workspace }}/caliper-install/bin:${PATH}
        echo -e "PATH=${PATH}"
        echo -e "PWD:${PWD}"
        which cali-query
        echo "${{ github.workspace }}/caliper-install/bin" >> "$GITHUB_PATH"
        echo "LD_LIBRARY_PATH=${{ github.workspace }}/caliper-install/lib:${{ github.workspace }}/caliper-install/lib64:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

    - name: Test Caliper and Timemory Support with pytest
      run: |
        which cali-query
        PYTHONPATH=. $(which pytest)
